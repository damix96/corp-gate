name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    env:
      CORPGATE_DB_PATH: ":memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:ui
      - run: npm test
      - run: npm run test:secrets
      - run: npm run test:variables
      - run: npm run test:installation
      - run: npm run test:runtime
      - run: npm run test:installation:native
        if: runner.os == 'Windows'
      - run: npm run verify:pack
