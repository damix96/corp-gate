name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    env:
      CORPGATE_DB_PATH: ":memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Start Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11
          eval "$(dbus-launch --sh-syntax)"
          export DBUS_SESSION_BUS_ADDRESS
          export GNOME_KEYRING_CONTROL="${RUNNER_TEMP}/gnome-keyring"
          mkdir -p "$GNOME_KEYRING_CONTROL"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
          printf '' | gnome-keyring-daemon --login --components=secrets
          eval "$(gnome-keyring-daemon --start --components=secrets)"
      - run: npm ci
      - run: npm run build
      - run: npm run check:ui
      - run: npm test
      - run: npm run test:secrets
      - run: npm run test:variables
      - run: npm run test:installation
      - run: npm run test:runtime
      - run: npm run test:installation:native
        if: runner.os == 'Windows'
      - run: npm run verify:pack
